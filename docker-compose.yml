services:

  core:
    container_name: core
    privileged: true
    build:
      context: ./core
    image: identity-link-core
    ports:
      - 9000:80
    volumes:
      - ./core:/var/www
    environment:
      PGHOST: database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - database-server
    networks:
      - my-network

  db-users:
    container_name: db-users
    privileged: true
    build:
      context: ./db-users
    image: identity-link-db-users
    ports:
      - 9001:80
    volumes:
      - ./db-users:/var/www
    environment:
      PGHOST: database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - database-server
    networks:
      - my-network

  db-clients:
    container_name: db-clients
    privileged: true
    build:
      context: ./db-clients
    image: identity-link-db-clients
    ports:
      - 9002:80
    volumes:
      - ./db-clients:/var/www
    environment:
      PGHOST: database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - database-server
    networks:
      - my-network

  2fa:
    container_name: 2fa
    privileged: true
    build:
      context: ./2fa
    image: identity-link-2fa
    ports:
      - 9003:80
    volumes:
      - ./2fa:/var/www
    environment:
      PGHOST: database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - database-server
    networks:
      - my-network

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
      - protected.example.com:${HOST_GW:-host-gateway}
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/certificates/_wildcard.example.com+3.pem:/etc/nginx/certs/example.com.crt:ro
      - ./config/certificates/_wildcard.example.com+3-key.pem:/etc/nginx/certs/example.com.key:ro
    networks:
      - my-network

  database-server:
    container_name: database-server
    image: postgres:15
    restart: always
    ports:
      - "9006:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - my-network

  redis:
    image: redis:alpine
    ports:
      - "9008:6379"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - my-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "9007:8081"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - redis
    networks:
      - my-network

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - 9009:8080
    volumes:
      - ./config/swagger-config.json:/usr/share/nginx/html/swagger-config.json
    environment:
      CONFIG_URL: /swagger/swagger-config.json
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - my-network

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: database-server
    ports:
      - 9005:8080
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - my-network

  smtp-server:
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - 9025:1025 # smtp server
      - 9026:8025 # web ui
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - my-network

networks:
  my-network:
    driver: bridge
