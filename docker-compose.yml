services:

  identity-link-core:
    container_name: identity-link-core
    privileged: true
    build:
      context: ./identity-link-core
      dockerfile: Dockerfile
      target: dev
    image: identity-link-core
    ports:
      - "9000:9000"
    volumes:
      - ./identity-link-core:/app
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      identity-link-database-server:
        condition: service_healthy
    networks:
      - identity-link-network

  identity-link-db-users:
    container_name: identity-link-db-users
    privileged: true
    build:
      context: ./identity-link-db-users
      dockerfile: Dockerfile
      target: dev
    image: identity-link-db-users
    ports:
      - "9001:9001"
    volumes:
      - ./identity-link-db-users:/app
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      identity-link-database-server:
        condition: service_healthy
    networks:
      - identity-link-network

  identity-link-db-clients:
    container_name: identity-link-db-clients
    privileged: true
    build:
      context: ./identity-link-db-clients
      dockerfile: Dockerfile
      target: dev
    image: identity-link-db-clients
    ports:
      - "9002:9002"
    volumes:
      - ./identity-link-db-clients:/app
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      identity-link-database-server:
        condition: service_healthy
    networks:
      - identity-link-network

  identity-link-2fa:
    container_name: identity-link-2fa
    privileged: true
    build:
      context: ./identity-link-2fa
    image: identity-link-2fa
    ports:
      - "9003:80"
    volumes:
      - ./identity-link-2fa:/var/www
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      identity-link-database-server:
        condition: service_healthy
    networks:
      - identity-link-network

  identity-link-console:
    container_name: identity-link-console
    privileged: true
    build:
      context: ./identity-link-console
    image: identity-link-console
    ports:
      - "9005:9005"
    networks:
      - identity-link-network

  identity-link-proxy:
    container_name: identity-link-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
      - protected.example.com:${HOST_GW:-host-gateway}
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/certificates/_wildcard.example.com+3.pem:/etc/nginx/certs/example.com.crt:ro
      - ./config/certificates/_wildcard.example.com+3-key.pem:/etc/nginx/certs/example.com.key:ro
    networks:
      - identity-link-network

  identity-link-database-server:
    container_name: identity-link-database-server
    image: postgres:15
    restart: always
    ports:
      - "9006:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-redis:
    container_name: identity-link-redis
    image: redis:alpine
    ports:
      - "9008:6379"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-adminer:
    container_name: identity-link-adminer
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: identity-link-database-server
    ports:
      - "9007:8080"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-smtp-server:
    container_name: identity-link-smtp-server
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - "9025:1025" # smtp server
      - "9026:8025" # web ui
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

networks:
  identity-link-network:
    name: identity-link-network
    driver: bridge
