services:

  identity-link-core:
    container_name: identity-link-core
    privileged: true
    build:
      context: ./identity-link-core
    image: identity-link-core
    ports:
      - 9000:80
    volumes:
      - ./identity-link-core:/var/www
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - identity-link-database-server
    networks:
      - identity-link-network

  identity-link-db-users:
    container_name: identity-link-db-users
    privileged: true
    build:
      context: ./identity-link-db-users
    image: identity-link-db-users
    ports:
      - 9001:80
    volumes:
      - ./identity-link-db-users:/var/www
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - identity-link-database-server
    networks:
      - identity-link-network

  identity-link-db-clients:
    container_name: identity-link-db-clients
    privileged: true
    build:
      context: ./identity-link-db-clients
    image: identity-link-db-clients
    ports:
      - 9002:80
    volumes:
      - ./identity-link-db-clients:/var/www
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - identity-link-database-server
    networks:
      - identity-link-network

  identity-link-2fa:
    container_name: identity-link-2fa
    privileged: true
    build:
      context: ./identity-link-2fa
    image: identity-link-2fa
    ports:
      - 9003:80
    volumes:
      - ./identity-link-2fa:/var/www
    environment:
      PGHOST: identity-link-database-server
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - identity-link-database-server
    networks:
      - identity-link-network

  identity-link-proxy:
    container_name: identity-link-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
      - protected.example.com:${HOST_GW:-host-gateway}
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/certificates/_wildcard.example.com+3.pem:/etc/nginx/certs/example.com.crt:ro
      - ./config/certificates/_wildcard.example.com+3-key.pem:/etc/nginx/certs/example.com.key:ro
    networks:
      - identity-link-network

  identity-link-database-server:
    container_name: identity-link-database-server
    image: postgres:15
    restart: always
    ports:
      - "9006:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-redis:
    container_name: identity-link-redis
    image: redis:alpine
    ports:
      - "9008:6379"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-redis-commander:
    container_name: identity-link-redis-commander
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:identity-link-redis:6379
    ports:
      - "9007:8081"
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    depends_on:
      - identity-link-redis
    networks:
      - identity-link-network

  identity-link-swagger-ui:
    container_name: identity-link-swagger-ui
    image: swaggerapi/swagger-ui
    ports:
      - 9009:8080
    volumes:
      - ./config/swagger-config.json:/usr/share/nginx/html/swagger-config.json
    environment:
      CONFIG_URL: /swagger/swagger-config.json
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-adminer:
    container_name: identity-link-adminer
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: identity-link-database-server
    ports:
      - 9005:8080
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

  identity-link-smtp-server:
    container_name: identity-link-smtp-server
    image: mailhog/mailhog
    logging:
      driver: 'none'  # disable saving logs
    ports:
      - 9025:1025 # smtp server
      - 9026:8025 # web ui
    extra_hosts:
      - host.docker.internal:${HOST_GW:-host-gateway}
      - auth.example.com:${HOST_GW:-host-gateway}
    networks:
      - identity-link-network

networks:
  identity-link-network:
    name: identity-link-network
    driver: bridge
