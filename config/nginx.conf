events {}

http {

    # HTTP server for localhost (no HTTPS)
    server {
        listen 80;
        server_name localhost;

        location /db/ {
            rewrite ^/db/(.*)$ /$1 break;
            proxy_pass http://host.docker.internal:9005/;
            proxy_set_header Host $host;
        }

        location /mail/ {
            rewrite ^/mail/(.*)$ /$1 break;
            proxy_pass http://host.docker.internal:9026/;
            proxy_set_header Host $host;
        }
    }

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name auth.example.com protected.example.com ui.example.com;

        return 301 https://$host$request_uri;
    }

    # HTTPS server for auth.example.com
    server {
        listen 443 ssl;
        server_name auth.example.com;

        ssl_certificate /etc/nginx/certs/example.com.crt;
        ssl_certificate_key /etc/nginx/certs/example.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Proxy core service at root
        location / {
            proxy_pass http://host.docker.internal:9000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        location /users/ {
            proxy_pass http://host.docker.internal:9001/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /users;
        }

        location /clients/ {
            proxy_pass http://host.docker.internal:9002/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /clients;
        }

        location /2fa/ {
            proxy_pass http://host.docker.internal:9003/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /2fa;
        }
    }

    server {
        listen 443 ssl;
        server_name ui.example.com;

        ssl_certificate /etc/nginx/certs/example.com.crt;
        ssl_certificate_key /etc/nginx/certs/example.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://host.docker.internal:9005/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /bff/ {
            proxy_pass http://host.docker.internal:9004/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Prefix /bff;
        }
    }

    # HTTPS server for protected.example.com
    server {
        listen 443 ssl;
        server_name protected.example.com;

        ssl_certificate /etc/nginx/certs/example.com.crt;
        ssl_certificate_key /etc/nginx/certs/example.com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://host.docker.internal:9010/;
            proxy_set_header Host $host;
        }
    }
}
