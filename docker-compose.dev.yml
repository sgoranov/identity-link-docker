services:

  identity-link-core:
    build:
      context: ./src/identity-link-core
      target: dev
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: /app/var/keys/public_key
      JWT_PRIVATE_KEY_PATH: /app/var/keys/private_key
      ENCRYPTION_KEY_PATH: /app/var/keys/encryption_key
    image: identity-link-core:dev
    volumes:
      - ./src/identity-link-core:/app
      - ./config/keys:/app/var/keys

  identity-link-db-users:
    build:
      context: ./src/identity-link-db-users
      target: dev
    image: identity-link-db-users:dev
    volumes:
      - ./src/identity-link-db-users:/app
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FEATURE_PASSWORD_VALIDATION_ENABLED: false
      MAILER_DSN: smtp://user%40domain.com:pass@identity-link-smtp-server:1025
      MAILER_FROM_ADDRESS: no-reply@${DOMAIN_NAME}
      MAILER_FROM_NAME: 'Identity Link'

  identity-link-db-clients:
    build:
      context: ./src/identity-link-db-clients
      target: dev
    image: identity-link-db-clients:dev
    volumes:
      - ./src/identity-link-db-clients:/app
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  identity-link-2fa:
    build:
      context: ./src/identity-link-2fa
      target: dev
    image: identity-link-2fa:dev
    volumes:
      - ./src/identity-link-2fa:/app
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

  identity-link-bff:
    build:
      context: ./src/identity-link-bff
      target: dev
    image: identity-link-bff:dev
    volumes:
      - ./src/identity-link-bff:/app
      - ./runtime:/runtime
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      PROXY_DEBUG: true
      HTTP_CLIENT_SSL_VERIFYPEER: 0
      HTTP_CLIENT_SSL_VERIFYHOST: 0
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /runtime/client-data.txt /app/.env.local
        exec /entrypoint.sh frankenphp run --config /etc/caddy/Caddyfile
    extra_hosts:
      - "${DOMAIN_NAME}:host-gateway"
    depends_on:
      identity-link-client-generator:
        condition: service_completed_successfully

  identity-link-console:
    build:
      context: ./src/identity-link-console
      target: dev
    image: identity-link-console:dev
    volumes:
      - ./src/identity-link-console:/app
      - /app/node_modules

  identity-link-proxy:
    volumes:
      - ./config/nginx.dev.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./config/certificates/local-dev.crt:/etc/nginx/certs/server.crt:ro
      - ./config/certificates/local-dev.key:/etc/nginx/certs/server.key:ro

  identity-link-adminer:
    container_name: identity-link-adminer
    image: adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: identity-link-database-server
    ports:
      - "8080:8080"
    networks:
      - identity-link-network

  identity-link-smtp-server:
    container_name: identity-link-smtp-server
    image: mailhog/mailhog
    logging:
      driver: 'none'
    ports:
      - "8025:8025"
    networks:
      - identity-link-network

  identity-link-keys-generator:
    container_name: identity-link-keys-generator
    build:
      context: ./src/identity-link-core
      target: dev
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    image: identity-link-core:dev
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        composer install --no-interaction --no-scripts --no-progress
        php bin/console identity-link:generate-encryption-key --key-path var/keys/encryption_key
        php bin/console identity-link:generate-jwt-keys --public-key-path var/keys/public_key --private-key-path var/keys/private_key
    volumes:
      - ./src/identity-link-core:/app
      - ./config/keys:/app/var/keys

  identity-link-user-generator:
    container_name: identity-link-user-generator
    build:
      context: ./src/identity-link-db-users
      target: dev
    image: identity-link-db-users:dev
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FEATURE_PASSWORD_VALIDATION_ENABLED: false
      GROUP_NAME: administrator
      GROUP_AUDIENCE: https://${DOMAIN_NAME}/identity-link
      GROUP_SCOPES: oidc.default identity-link.all
      USER_NAME: user
      USER_EMAIL: test@${DOMAIN_NAME}
      USER_FIRST_NAME: Test
      USER_LAST_NAME: User
      USER_PASSWORD: pass
      USER_GRANT_TYPES: password authorization_code refresh_token
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        composer install --no-interaction --no-scripts --no-progress

        set --
        for scope in $$GROUP_SCOPES; do
          set -- "$$@" --scope "$$scope"
        done

        php bin/console app:configure-group-scopes \
          --group "$$GROUP_NAME" \
          --audience "$$GROUP_AUDIENCE" \
          "$$@"

        set --
        for grant_type in $$USER_GRANT_TYPES; do
          set -- "$$@" --grant-type "$$grant_type"
        done

        php bin/console app:create-user \
          --username "$$USER_NAME" \
          --email "$$USER_EMAIL" \
          --first-name "$$USER_FIRST_NAME" \
          --last-name "$$USER_LAST_NAME" \
          --password "$$USER_PASSWORD" \
          --group "$$GROUP_NAME" \
          "$$@"
    volumes:
      - ./src/identity-link-db-users:/app
    depends_on:
      identity-link-db-users:
        condition: service_healthy
    networks:
      - identity-link-network

  identity-link-client-generator:
    container_name: identity-link-client-generator
    build:
      context: ./src/identity-link-db-clients
      target: dev
    image: identity-link-db-clients:dev
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GROUP_NAME: administrator
      GROUP_AUDIENCE: https://${DOMAIN_NAME}/identity-link
      GROUP_SCOPES: oidc.default identity-link.all
      CLIENT_NAME: default-client
      CLIENT_DESCRIPTION: Default development client
      CLIENT_AUDIENCE: https://${DOMAIN_NAME}/identity-link
      CLIENT_REDIRECT_URIS: https://${DOMAIN_NAME}/bff/login_check
      CLIENT_GRANT_TYPES: client_credentials password authorization_code refresh_token
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        set -eu

        composer install --no-interaction --no-scripts --no-progress

        set --
        for scope in $$GROUP_SCOPES; do
          set -- "$$@" --scope "$$scope"
        done

        php bin/console app:configure-group-scopes \
          --group "$$GROUP_NAME" \
          --audience "$$GROUP_AUDIENCE" \
          "$$@"

        set --
        for redirect_uri in $$CLIENT_REDIRECT_URIS; do
          set -- "$$@" --redirect-uri "$$redirect_uri"
        done

        for grant_type in $$CLIENT_GRANT_TYPES; do
          set -- "$$@" --grant-type "$$grant_type"
        done

        php bin/console app:create-client \
          --name "$$CLIENT_NAME" \
          --description "$$CLIENT_DESCRIPTION" \
          --audience "$$CLIENT_AUDIENCE" \
          --group "$$GROUP_NAME" \
          "$$@" \
          > /tmp/client-output.txt

        cat /tmp/client-output.txt

        CLIENT_ID=$$(sed -n 's/^[[:space:]]*Client ID[[:space:].]*//p' /tmp/client-output.txt)
        CLIENT_SECRET=$$(sed -n 's/^[[:space:]]*Client secret[[:space:].]*//p' /tmp/client-output.txt)
        test -n "$$CLIENT_ID"
        test -n "$$CLIENT_SECRET"

        umask 077
        echo "OIDC_CLIENT_ID=$$CLIENT_ID" > /runtime/client-data.txt
        echo "OIDC_CLIENT_SECRET=$$CLIENT_SECRET" >> /runtime/client-data.txt
    volumes:
      - ./src/identity-link-db-clients:/app
      - ./runtime:/runtime
    depends_on:
      identity-link-db-clients:
        condition: service_healthy
    networks:
      - identity-link-network

  identity-link-database-server:
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
